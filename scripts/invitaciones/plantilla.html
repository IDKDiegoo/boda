<style>
/* ═══ Invitación My Wedding · plantilla única: los datos de cada pareja vienen en DATOS (abajo) ═══ */
:root {
  --olivo: #5b6b3a; --olivo-osc: #3c4728; --olivo-hondo: #2c3520; --salvia: #b9c29a; --salvia-clara: #dfe3cc;

  --texto: "Jost", "Helvetica Neue", Arial, sans-serif;
  --script: "Pinyon Script", "Snell Roundhand", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--papel); color: var(--tinta); }
body { font-family: var(--texto); font-weight: 300; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

img { max-width: 100%; display: block; }

/* ── El sobre ─────────────────────────────────────────────── */
.escena { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px 16px;
  background: radial-gradient(120% 90% at 50% 40%, #4a5830 0%, var(--olivo-osc) 55%, var(--olivo-hondo) 100%); transition: opacity .9s ease, visibility .9s; }
.escena::before { content: ""; position: absolute; inset: 0; opacity: .5; background-image: inherit; }

.para { font-family: var(--display); font-style: italic; font-size: clamp(20px, 5.5vw, 26px); color: var(--salvia-clara); text-align: center; min-height: 1.4em; }

.sobre > div { position: absolute; inset: 0; border-radius: 6px; }

.carta { inset: 6% 5% 4% 5% !important; background: var(--papel); border-radius: 4px; display: grid; place-items: center; text-align: center;

.carta > div { opacity: 0; transition: opacity .5s ease .35s; }

.carta b i { font-family: var(--display); font-style: italic; color: var(--oro); font-size: .9em; padding: 0 .15em; }
.sobre-frente { background:

  clip-path: polygon(0 34%, 50% 70%, 100% 34%, 100% 100%, 0 100%); }

/* frase */
.frase { background: var(--olivo-osc); color: var(--salvia-clara); }

/* cuenta regresiva */

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 999px; border: 1px solid var(--olivo); background: transparent; color: var(--olivo-osc);

/* confirmación */

form { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; text-align: left; }

  100% { transform: translate3d(var(--deriva), 108vh, 0) rotate(var(--giro)); opacity: 0; } }

/* aparecer al bajar (en reposo todo visible: solo se oculta si el navegador puede animarlo) */

<script>
const DATOS = /*__DATOS__*/{};

// ── utilidades ──
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mapa = d => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(d);
const [A, M, D] = DATOS.fecha.split("-");
const fechaPuntos = `${D} · ${M} · ${A}`;

// Rama de olivo dibujada: un tallo curvo con hojas alternadas.
function rama(hojas = 9, conAceitunas = true) {
  let h = "";
  for (let i = 0; i < hojas; i++) {
    const t = i / (hojas - 1), x = 20 + t * 110, y = 150 - t * 120 - Math.sin(t * 3) * 8, lado = i % 2 ? 1 : -1, ang = -55 + lado * 38 - t * 15;
    h += `<ellipse cx="${x + lado * 9}" cy="${y - 4}" rx="5" ry="15" transform="rotate(${ang} ${x + lado * 9} ${y - 4})" fill="url(#hoja)" opacity="${.8 + (i % 3) * .07}"/>`;
    if (conAceitunas && i % 4 === 2) h += `<ellipse cx="${x - lado * 6}" cy="${y + 6}" rx="3.6" ry="4.6" fill="#3c4728"/>`;
  }
  return `<svg class="rama-svg" viewBox="0 0 150 170" aria-hidden="true"><defs><linearGradient id="hoja" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a9a5b"/><stop offset="1" stop-color="#4e5d31"/></linearGradient></defs>
    <path d="M14 162 C 50 120, 80 90, 135 22" fill="none" stroke="#5b6b3a" stroke-width="1.6"/>${h}</svg>`;
}
const hojita = `<svg viewBox="0 0 20 34"><path d="M10 1 C 18 10, 18 24, 10 33 C 2 24, 2 10, 10 1 Z" fill="#7d8c4e"/><path d="M10 3 V 31" stroke="#556333" stroke-width=".8"/></svg>`;
const ICONOS = {
  capilla: `<svg class="ico" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 4v8M28.5 7.5h7"/><path d="M22 26 32 13l10 13"/><path d="M24 26v34h16V26"/><path d="M29 60V50a3 3 0 0 1 6 0v10"/><circle cx="32" cy="34" r="3"/><path d="M12 60V40l12-10M52 60V40L40 30"/><path d="M6 60h52"/><path d="M16 46h4v6h-4zM44 46h4v6h-4z"/></svg>`,
  copas: `<svg class="ico" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 10h14l-1 12a6 6 0 0 1-12 0z"/><path d="M21 28v20M15 48h12"/><path d="M38 14l13 4-4 11a6 6 0 0 1-11-3.5z" /><path d="M41 31l-5 18M30 47l11 3"/><path d="M15 17h12M38.5 19l11.5 3.5"/><path d="M33 6l2-3M36 8l3-1M30 7l-1-3"/></svg>`,
  traje: `<svg viewBox="0 0 74 110" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M28 6h18l6 6 12 8v70H10V20l12-8z"/><path d="M28 6l9 22 9-22"/><path d="M37 28v62"/><path d="M33 13l4 5 4-5-4-3z"/><path d="M22 12l7 30-7 6M52 12l-7 30 7 6"/><circle cx="37" cy="54" r="1.2"/><circle cx="37" cy="66" r="1.2"/><path d="M10 20 4 70M64 20l6 50"/></svg>`,
  vestido: `<svg viewBox="0 0 74 110" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M29 4v14M45 4v14"/><path d="M29 18c2 6 14 6 16 0l3 18H26z"/><path d="M26 36c-6 20-14 40-20 70h62c-6-30-14-50-20-70"/><path d="M37 40c-2 22-6 44-12 66M37 40c2 22 6 44 12 66"/><path d="M26 36h22"/></svg>`,
  mapa: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`,
  cal: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>`,
  hoja: `<svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2c6 4 6 12 0 16C4 14 4 6 10 2z" fill="currentColor"/></svg>`,
  nota: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>`,
};

function calendario() {
  const f = DATOS.fecha.replace(/-/g, ""), sig = new Date(DATOS.fecha + "T12:00:00"); sig.setDate(sig.getDate() + 1);
  const f2 = sig.toISOString().slice(0, 10).replace(/-/g, "");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(`Matrimonio ${DATOS.ella} y ${DATOS.el}`) +
    `&dates=${f}/${f2}&location=` + encodeURIComponent(DATOS.ceremonia.lugar + ", " + DATOS.ceremonia.direccion);
}
const mono = () => `<div class="mono-letras" aria-hidden="true"><span>${esc(DATOS.monograma[0])}</span><span>${esc(DATOS.monograma[1])}</span></div>`;
const filete = `<div class="filete" aria-hidden="true">${ICONOS.hoja}</div>`;
function tarjetaLugar(l, ico, d) {
  return `<article class="tarjeta rev ${d}">${ICONOS[ico]}<p class="ceja">${esc(l.titulo)}</p><h3>${esc(l.lugar)}</h3>
    <div class="hora ${l.hora ? "" : "pend"}">${l.hora ? esc(l.hora) + " hrs" : "Hora por confirmar"}</div>
    <p class="dir">${esc(l.direccion)}</p>
    <div class="botones"><a class="btn" href="${mapa(l.lugar + ", " + l.direccion)}" target="_blank" rel="noopener">${ICONOS.mapa}Cómo llegar</a></div></article>`;
}

// ── armar la página ──
function armar() {
  const d = DATOS, r = d.rsvp || {};
  const portadaFoto = d.foto ? `<img src="${esc(d.foto)}" alt="${esc(d.ella)} y ${esc(d.el)}">` : `<div class="mono">${mono()}</div>`;
  let html = `
  <section class="seccion portada">
    <div class="rama izq">${rama()}</div><div class="rama der">${rama(8)}</div>
    <p class="ceja rev">Nos casamos</p>
    <div class="arco rev d1">${portadaFoto}</div>
    <h1 class="nombres rev d2">${esc(d.ella)}<span class="amp">&amp;</span>${esc(d.el)}</h1>
    <div class="fecha-grande rev d3">${fechaPuntos}</div>
    <div class="baja" aria-hidden="true"><span>Desliza</span><i></i></div>
  </section>
  <section class="seccion frase">
    ${filete}
    <blockquote class="rev">${esc(d.frase)}</blockquote>
    <cite class="rev d1">${esc(d.fraseCita)}</cite>
  </section>
  <section class="seccion">
    <p class="ceja rev">${esc(d.fechaLarga)}</p>
    <h2 class="rev d1">Falta muy poco</h2>
    <div class="cuenta rev d2" id="cuenta" aria-live="off">
      <div><b data-k="d">–</b><small>Días</small></div><div><b data-k="h">–</b><small>Horas</small></div>
      <div><b data-k="m">–</b><small>Min</small></div><div><b data-k="s">–</b><small>Seg</small></div>
    </div>
    <div class="botones rev d3"><a class="btn" href="${calendario()}" target="_blank" rel="noopener">${ICONOS.cal}Guardar la fecha</a></div>
  </section>
  <section class="seccion">
    <p class="ceja rev">Dónde</p>
    <h2 class="rev d1">Celebra con nosotros</h2>
    <div class="lugares">${tarjetaLugar(d.ceremonia, "capilla", "d1")}${tarjetaLugar(d.celebracion, "copas", "d2")}</div>
  </section>`;
  if (d.itinerario?.length) html += `
  <section class="seccion"><p class="ceja rev">El día</p><h2 class="rev d1">Itinerario</h2>
    <div class="linea">${d.itinerario.map((x, i) => `<div class="rev d${(i % 3) + 1}"><b>${esc(x.hora)}</b>${esc(x.texto)}</div>`).join("")}</div></section>`;
  html += `
  <section class="seccion vestimenta">
    <p class="ceja rev">Código de vestimenta</p>
    <div class="trajes rev d1" aria-hidden="true">${ICONOS.vestido}${ICONOS.traje}</div>
    <div class="codigo rev d2">${esc(d.vestimenta.nombre)}</div>
    ${d.vestimenta.detalle ? `<p class="rev d3" style="margin:0;color:var(--suave);max-width:34ch">${esc(d.vestimenta.detalle)}</p>` : ""}
  </section>`;
  if (d.regalos) html += `
  <section class="seccion"><p class="ceja rev">Regalos</p><h2 class="rev d1">${esc(d.regalos.titulo || "Lluvia de sobres")}</h2>
    <p class="rev d2" style="margin:0;max-width:38ch;color:var(--suave)">${esc(d.regalos.texto)}</p>
    ${d.regalos.datos ? `<p class="rev d3" style="margin:0;white-space:pre-line">${esc(d.regalos.datos)}</p>` : ""}</section>`;
  html += `
  <section class="seccion rsvp" id="confirmar">
    <p class="ceja rev">Confirmación</p>
    <h2 class="rev d1">¿Nos acompañas?</h2>
    <p class="rev d2">${r.fechaLimite ? `Por favor confirma tu asistencia antes del ${esc(r.fechaLimite)}.` : "Por favor confirma tu asistencia."}</p>
    <div class="ancho rev d3" id="rsvp-caja">${formulario(r)}</div>
  </section>
  <section class="seccion cierre">
    ${mono()}
    <h2 class="rev">Te esperamos</h2>
    <p class="ceja rev d1">${esc(d.ella)} &amp; ${esc(d.el)} · ${fechaPuntos}</p>
    <p class="pie">Invitación hecha con My Wedding</p>
  </section>`;
  $("#inv").innerHTML = html;
}

// Confirmación: si hay un Google Forms conectado (accion + campos), se responde aquí mismo y la respuesta cae
// en la planilla de los novios; si solo hay link, se abre el formulario; si no hay nada, se avisa.
function formulario(r) {
  if (r.accion && r.campos) return `<form id="form-rsvp" novalidate>
      <label>Tu nombre<input name="nombre" autocomplete="name" required placeholder="Nombre y apellido"></label>
      <div><label style="margin-bottom:10px">¿Asistirás?</label><div class="opciones">
        <label><input type="radio" name="asiste" value="Sí, asistiré" required><span>Sí, asistiré</span></label>
        <label><input type="radio" name="asiste" value="No podré ir"><span>No podré ir</span></label></div></div>
      ${r.campos.acompanantes ? `<label>¿Cuántas personas en total?<select name="acompanantes">${[1, 2, 3, 4, 5, 6].map(n => `<option>${n}</option>`).join("")}</select></label>` : ""}
      ${r.campos.alimentacion ? `<label>Restricción alimentaria<input name="alimentacion" placeholder="Vegetariano, celíaco, alergias…"></label>` : ""}
      ${r.campos.mensaje ? `<label>Un mensaje para los novios<textarea name="mensaje" rows="3" placeholder="Opcional"></textarea></label>` : ""}
      <button class="btn" type="submit">Confirmar</button><div class="aviso" id="aviso-rsvp" role="status"></div></form>`;
  if (r.formUrl) return `<div class="botones"><a class="btn" href="${esc(r.formUrl)}" target="_blank" rel="noopener">Confirmar asistencia</a></div>`;
  return `<div class="botones"><button class="btn" disabled>Confirmar asistencia</button></div><p class="aviso">El formulario de confirmación se habilita muy pronto.</p>`;
}
function activarFormulario() {
  const f = $("#form-rsvp"); if (!f) return;
  const r = DATOS.rsvp;
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const datos = new FormData(f), aviso = $("#aviso-rsvp");
    if (!String(datos.get("nombre") || "").trim()) { aviso.textContent = "Escribe tu nombre para confirmar."; return; }
    if (!datos.get("asiste")) { aviso.textContent = "Elige si asistirás."; return; }
    const cuerpo = new URLSearchParams();
    for (const [k, entrada] of Object.entries(r.campos)) if (entrada && datos.get(k) != null) cuerpo.append(entrada, datos.get(k));
    const b = f.querySelector("button"); b.disabled = true; b.textContent = "Enviando…";
    try {
      await fetch(r.accion, { method: "POST", mode: "no-cors", body: cuerpo });   // Google Forms no responde con CORS: se envía igual
      const si = String(datos.get("asiste")).startsWith("Sí");
      $("#rsvp-caja").innerHTML = `<div class="gracias">${filete}<b>${si ? "¡Gracias!" : "Te vamos a extrañar"}</b><p>${si ? "Recibimos tu confirmación. Nos vemos el " + esc(DATOS.fechaLarga.toLowerCase()) + "." : "Gracias por avisarnos."}</p></div>`;
    } catch { b.disabled = false; b.textContent = "Confirmar"; aviso.textContent = "No se pudo enviar. Revisa tu conexión e inténtalo de nuevo."; }
  });
}

function cuentaRegresiva() {
  const meta = new Date(DATOS.fecha + "T" + ((DATOS.ceremonia.hora || "00:00").padStart(5, "0")) + ":00-03:00").getTime();
  const els = {}; document.querySelectorAll("#cuenta b").forEach(b => els[b.dataset.k] = b);
  const tic = () => {
    let s = Math.max(0, Math.floor((meta - Date.now()) / 1000));
    const v = { d: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), s: s % 60 };
    for (const k in v) els[k].textContent = k === "d" ? v[k] : String(v[k]).padStart(2, "0");
  };
  tic(); setInterval(tic, 1000);
}

function aparecer() {
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.documentElement.classList.add("anima");
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("vis"); io.unobserve(e.target); } }), { threshold: .15, rootMargin: "0px 0px -6% 0px" });
  document.querySelectorAll(".rev").forEach(el => io.observe(el));
}

function hojas() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const caja = $(".hojas");
  for (let i = 0; i < 9; i++) {
    const h = document.createElement("div"); h.className = "hoja"; h.innerHTML = hojita;
    h.style.left = (5 + Math.random() * 90) + "%"; h.style.animationDuration = (14 + Math.random() * 12) + "s"; h.style.animationDelay = (-Math.random() * 20) + "s";
    h.style.setProperty("--deriva", ((Math.random() - .5) * 220) + "px"); h.style.setProperty("--giro", ((Math.random() - .5) * 720) + "deg");
    h.style.scale = String(.6 + Math.random() * .6); caja.appendChild(h);
  }
}

function musica() {
  if (!DATOS.cancion) return;
  const a = new Audio(DATOS.cancion); a.loop = true; a.volume = .6;
  const b = document.createElement("button"); b.className = "musica"; b.setAttribute("aria-label", "Música"); b.innerHTML = ICONOS.nota; document.body.appendChild(b);
  const poner = on => { on ? a.play().catch(() => {}) : a.pause(); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); };
  b.onclick = () => poner(a.paused); return poner;
}

// ── el sobre ──
const para = new URLSearchParams(location.search).get("para");
if (para) $("#para").textContent = "Para " + para.slice(0, 60);
$("#sello-mono").textContent = DATOS.monograma.join("");
$("#carta-nombres").innerHTML = `${esc(DATOS.ella)}<i>&amp;</i>${esc(DATOS.el)}`;
$("#carta-fecha").textContent = fechaPuntos;
armar(); activarFormulario(); cuentaRegresiva(); hojas();
const ponerMusica = musica();
let abierta = false;
function abrir() {
  if (abierta) return; abierta = true;
  $("#sobre").classList.add("abierto"); ponerMusica?.(true);
  const lento = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(() => {
    $("#escena").classList.add("fuera"); document.body.classList.remove("cerrado"); $("#inv").removeAttribute("aria-hidden");
    aparecer(); window.scrollTo(0, 0);
  }, lento ? 1900 : 50);
}
$("#sello").addEventListener("click", abrir);
$("#sobre").addEventListener("click", abrir);
</script>
</body>
</html>
